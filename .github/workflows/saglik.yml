# Saat başı sağlık kontrolü: site açılıyor mu, veritabanı ayakta mı. Başarısız olursa Actions'ta kırmızı görünür (e-posta gelir).
name: Sağlık kontrolü
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  saglik:
    runs-on: ubuntu-latest
    steps:
      - name: Site açılıyor mu
        run: |
          curl -fsS --retry 3 --retry-delay 10 -o index.html https://uckankeskinkaya.github.io/vocaboo/
          grep -q "Vocaboo" index.html
      - name: Veritabanı yanıt veriyor mu
        run: |
          curl -fsS --retry 3 --retry-delay 10 -o /dev/null \
            -H "apikey: sb_publishable_OIoMDW6WF-72Dg8DLQQvPQ_HHZ8JUfx" \
            "https://bzijkiljqlruwupqwtcm.supabase.co/auth/v1/health"
